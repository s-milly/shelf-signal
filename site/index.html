<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shelf Signal</title>
<style>
:root {
  color-scheme: light;
  --bg: #eef0ec; --panel: #ffffff; --well: #f3f4f1; --col: #f2f6fb;
  --ink: #14171a; --ink-2: #4a5058; --muted: #697079;
  --rule: #e1e4df; --rule-strong: #14171a; --axis: #b8bdb5;
  --s1: #2a62a8; --sig: #c4422a; --s3: #1f8a70;
  --shadow: 0 0 0 1px rgba(20,23,26,0.06), 0 1px 2px rgba(20,23,26,0.05), 0 6px 20px rgba(20,23,26,0.06);
  --lift: 0 0 0 1px rgba(20,23,26,0.06), 0 2px 4px rgba(20,23,26,0.06), 0 12px 32px rgba(20,23,26,0.12);
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Menlo, Consolas, monospace;
  --halo: var(--panel);
  font: 15px/1.5 var(--sans);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1113; --panel: #171a1d; --well: #1e2226; --col: #1a2230;
    --ink: #e8eaec; --ink-2: #b3b8be; --muted: #8b9198;
    --rule: #262a2f; --rule-strong: #e8eaec; --axis: #454b52;
    --s1: #4f8fdc; --sig: #e0613f; --s3: #2fa383;
    --shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 1px 2px rgba(0,0,0,0.4), 0 6px 20px rgba(0,0,0,0.35);
    --lift: 0 0 0 1px rgba(255,255,255,0.08), 0 2px 4px rgba(0,0,0,0.4), 0 12px 32px rgba(0,0,0,0.5);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0; font-weight: 650; text-wrap: balance; letter-spacing: -0.02em; }
p, ul, dl, dd { margin: 0; }
p, li { text-wrap: pretty; }
.small { font-size: 13px; color: var(--ink-2); }
.label { font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; border-radius: 4px; }
button, select, input, summary { -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 1440px; margin: 0 auto; padding: 0 32px; }
.panel { background: var(--panel); border: 1px solid transparent; border-radius: 14px; box-shadow: var(--shadow); }

/* top bar */
.bar { background: var(--panel); box-shadow: 0 1px 0 var(--rule); }
.bar-in { display: flex; align-items: center; gap: 14px; height: 56px; }
.mark { width: 22px; height: 22px; display: grid; grid-template-rows: repeat(3, 1fr); gap: 3px; padding: 2px 0; flex: none; }
.mark i { display: block; border-radius: 1.5px; background: var(--ink); }
.mark i:nth-child(1) { width: 60%; }
.mark i:nth-child(2) { width: 100%; background: var(--sig); }
.mark i:nth-child(3) { width: 82%; }
.brand { font-weight: 700; font-size: 16px; letter-spacing: -0.02em; white-space: nowrap; }
.crumb { color: var(--muted); font-size: 13px; display: flex; gap: 8px; align-items: center; min-width: 0; }
.crumb span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumb::before { content: ""; width: 1px; height: 18px; background: var(--rule); margin-right: 6px; }
.bar .label { margin-left: auto; }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 40px; align-items: end; padding: 40px 0 32px; }
.hero h1 { font-size: 44px; line-height: 1.04; letter-spacing: -0.035em; margin-top: 10px; max-width: 16ch; }
.hero h1 em { font-style: normal; color: var(--sig); }
.hero .lede { font-size: 16px; color: var(--ink-2); margin-top: 14px; max-width: 54ch; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.kpi { padding: 14px 16px 16px; display: grid; gap: 6px; align-content: start; }
.kpi .v { font-size: 30px; font-weight: 650; letter-spacing: -0.03em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.cmp { display: grid; gap: 5px; margin-top: 4px; }
.cmp div { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 12px; color: var(--ink-2); }
.cmp b { font-family: var(--mono); font-weight: 500; font-size: 12px; color: var(--ink); text-align: right; min-width: 48px; }
.cmp .t { height: 6px; background: var(--well); border-radius: 3px; position: relative; overflow: hidden; }
.cmp .t i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; }

/* desk */
.desk { display: grid; grid-template-columns: minmax(0, 1fr) 480px; gap: 20px; align-items: start; }
.sheet { padding: 20px 22px 22px; display: grid; gap: 16px; min-width: 0; }
.panel-head { display: flex; gap: 14px 20px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.panel-head h2 { font-size: 20px; line-height: 1.25; margin-top: 4px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 10px; padding: 3px; background: var(--well); }
.seg button { font: inherit; font-size: 13px; font-weight: 500; border: 0; background: none; color: var(--ink-2); padding: 6px 12px; border-radius: 6px; cursor: pointer;
  transition: background-color 120ms ease, color 120ms ease, scale 150ms ease-out; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--rule), 0 1px 2px rgba(20,23,26,0.08); }
.seg button:not(:disabled):active { scale: 0.96; }
.policy-note { font-size: 13px; color: var(--ink-2); max-width: 80ch; }
.totals { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--well); border-radius: 10px; }
.tot { padding: 12px 16px 13px; display: grid; gap: 3px; align-content: start; position: relative; }
.tot + .tot::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 1px; background: var(--rule); }
.tot .v { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.15; font-variant-numeric: tabular-nums; }
.tot .d { font-size: 12px; color: var(--ink-2); }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
input[type=search], select { font: inherit; font-size: 14px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--axis); background: var(--panel); color: var(--ink); }
input[type=search] { width: 240px; }

.ledger { width: 100%; border-collapse: collapse; font-size: 14px; }
.ledger th { text-align: left; font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted);
  padding: 8px 10px; border-bottom: 1px solid var(--rule-strong); white-space: nowrap; }
.ledger td { padding: 0; border-bottom: 1px solid var(--rule); }
.ledger .r { text-align: right; }
.ledger .oc { background: var(--col); }
.ledger tbody tr { cursor: pointer; transition: background-color 120ms ease; }
.ledger tbody tr[aria-selected="true"] { background: var(--well); box-shadow: inset 3px 0 0 var(--sig); }
.ledger tbody tr[aria-selected="true"] .oc { background: color-mix(in srgb, var(--col) 60%, var(--well)); }
@media (hover: hover) and (pointer: fine) { .ledger tbody tr:hover { background: var(--well); } }
.ledger td > span { display: block; padding: 9px 10px; }
.ledger .fig { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.ledger .order { font-weight: 700; font-size: 14px; }
.pid { font-weight: 550; display: block; }
.pid small { display: block; font-family: var(--mono); font-size: 11px; color: var(--muted); font-weight: 400; margin-top: 1px; }
.up { color: var(--s1); }
.down { color: var(--sig); }
.flag { font-size: 11px; font-weight: 600; color: var(--sig); background: color-mix(in srgb, var(--sig) 10%, transparent); border-radius: 5px; padding: 2px 7px; white-space: nowrap; display: inline-block; }
.more { font: inherit; font-size: 14px; font-weight: 500; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--axis); background: var(--panel); color: var(--ink); cursor: pointer; justify-self: start;
  transition: background-color 120ms ease, scale 150ms ease-out; }
.more:not(:disabled):active { scale: 0.96; }
@media (hover: hover) and (pointer: fine) { .more:hover { background: var(--well); } }

.file { position: sticky; top: 16px; padding: 20px 22px 22px; display: grid; gap: 16px; box-shadow: var(--lift); }
.file h2 { font-size: 24px; line-height: 1.15; margin-top: 4px; }
.file .meta { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.figs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.figs > div { background: var(--well); border-radius: 10px; padding: 10px 12px 11px; display: grid; gap: 2px; align-content: start; }
.figs > div.key { background: var(--col); }
.figs .v { font-size: 24px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.figs .d { font-size: 12px; color: var(--ink-2); }
.outcome { font-size: 14px; border-radius: 10px; padding: 11px 13px; background: var(--well); }
.outcome b { font-weight: 650; }
.reasons { list-style: none; padding: 0; display: grid; gap: 7px; font-size: 14px; }
.reasons li { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 8px; }
.reasons li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--sig); margin: 8px 0 0 3px; }
.math { font-size: 13px; color: var(--ink-2); padding-top: 12px; border-top: 1px dashed var(--rule); }

.legend { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.key-sq { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.key-band { width: 16px; height: 10px; background: color-mix(in srgb, var(--s1) 16%, transparent); display: inline-block; border-radius: 2px; }
.key-line { width: 16px; height: 0; border-top: 2px solid var(--ink); display: inline-block; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font-size: 12px; font-family: var(--sans); font-variant-numeric: tabular-nums; paint-order: stroke; stroke: var(--halo); stroke-width: 3px; stroke-linejoin: round; }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid transparent; border-radius: 10px;
  box-shadow: var(--lift); padding: 8px 10px; font-size: 13px; min-width: 150px; opacity: 0; transition: opacity 120ms ease; z-index: 2; }
.tip.on { opacity: 1; }
.tip .row { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
details summary { cursor: pointer; font-size: 13px; color: var(--ink-2); width: fit-content; }
table.plain { border-collapse: collapse; width: 100%; font-size: 14px; }
table.plain th, table.plain td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--rule); }
table.plain th { font-family: var(--mono); font-weight: 500; color: var(--muted); font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; }
table.plain th:first-child, table.plain td:first-child { padding-left: 0; }
table.plain .r { text-align: right; font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
table.plain th.r { font-size: 11px; }
table.plain tr.best td { font-weight: 700; }
table.plain tr.best td:first-child { box-shadow: inset 3px 0 0 var(--s1); padding-left: 10px; }

/* test report */
.report { display: grid; gap: 20px; padding: 56px 0 24px; }
.report-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; align-items: end; }
.report-head h2 { font-size: 34px; line-height: 1.1; letter-spacing: -0.03em; margin-top: 8px; max-width: 22ch; }
.report-head h2 em { font-style: normal; color: var(--sig); }
.report-head p { font-size: 15px; color: var(--ink-2); }
.grid12 { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 20px; }
.span7 { grid-column: span 7; } .span5 { grid-column: span 5; } .span6 { grid-column: span 6; } .span12 { grid-column: span 12; }
.card { padding: 18px 20px 20px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.card h3 { font-size: 16px; line-height: 1.3; }
.criteria { display: grid; gap: 8px; }
.crit { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding: 11px 13px; border-radius: 10px; background: var(--well); }
.crit .goal { font-size: 14px; }
.crit .res { font-family: var(--mono); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.crit .sub { grid-column: 1 / -1; font-size: 12px; color: var(--ink-2); }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 650; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 2px; }
.badge i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.badge.met { color: var(--s3); } .badge.met i { background: var(--s3); }
.badge.miss { color: var(--sig); } .badge.miss i { background: var(--sig); }
.list { padding-left: 18px; display: grid; gap: 9px; font-size: 14px; }
.list li::marker { color: var(--muted); }
.note { font-size: 12px; color: var(--muted); }
footer { padding: 8px 0 40px; font-size: 13px; color: var(--muted); }
.empty { padding: 40px 0; color: var(--ink-2); }

/* first load only: sections arrive in order */
@media (prefers-reduced-motion: no-preference) {
  .enter > * { animation: rise 300ms var(--ease-out) both; }
  .enter > *:nth-child(2) { animation-delay: 100ms; }
  .enter > *:nth-child(3) { animation-delay: 200ms; }
  .enter > *:nth-child(n+4) { animation-delay: 300ms; }
}
@media (prefers-reduced-motion: reduce) {
  .enter > * { animation: fade 300ms ease both; }
  .tip, .ledger tbody tr, .seg button, .more { transition: none; }
}
@keyframes rise { from { opacity: 0; transform: translateY(12px); filter: blur(4px); } }
@keyframes fade { from { opacity: 0; } }

@media (max-width: 1240px) {
  .hero { grid-template-columns: minmax(0, 1fr); gap: 24px; }
  .desk { grid-template-columns: minmax(0, 1fr); }
  .file { position: static; }
  .hide-md { display: none; }
  .span7, .span5 { grid-column: span 12; }
}
@media (max-width: 760px) {
  .wrap { padding: 0 16px; }
  .bar .label, .crumb .opt { display: none; }
  .hero { padding: 26px 0 22px; }
  .hero h1 { font-size: 32px; }
  .kpis { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .kpi { grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; }
  .kpi .label, .kpi .cmp { grid-column: 1 / -1; }
  .kpi .v { font-size: 26px; }
  .sheet, .file, .card { padding: 16px 14px 18px; }
  .totals { grid-template-columns: 1fr 1fr; }
  .tot:nth-child(3)::before { display: none; }
  .tot:nth-child(n+3) { border-top: 1px solid var(--rule); }
  .tot .v { font-size: 20px; }
  .hide-sm { display: none; }
  input[type=search] { width: 100%; }
  .tools select { flex: 1; }
  .figs .v { font-size: 20px; }
  .figs > div { padding: 8px 9px 9px; }
  .report { padding-top: 36px; }
  .report-head { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .report-head h2 { font-size: 26px; }
  .grid12 { gap: 12px; }
  .span6 { grid-column: span 12; }
}
</style>
</head>
<body>
<header class="bar">
  <div class="wrap bar-in">
    <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="brand">Shelf Signal</span>
    <span class="crumb"><span id="crumb">Monthly order sheet</span></span>
    <span class="label">Case study</span>
  </div>
</header>
<div class="wrap" id="app"><p class="empty">Loading data…</p></div>
<footer class="wrap" id="foot"></footer>
<script>
const $ = (s, el = document) => el.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? e.className = v : k === "text" ? e.textContent = v : e.setAttribute(k, v);
  for (const k of kids) if (k != null) e.append(k);
  return e;
};
const svgEl = (tag, attrs = {}) => {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
};
const int = n => Math.round(n).toLocaleString("en-US");
const usd = n => n >= 1e6 ? "$" + (n / 1e6).toFixed(2) + "M" : n >= 1e4 ? "$" + Math.round(n / 1000) + "K" : "$" + Math.round(n).toLocaleString("en-US");
const pct = (x, d = 0) => (x * 100).toFixed(d) + "%";
const spct = (x, d = 0) => { const v = +(x * 100).toFixed(d); return (v > 0 ? "+" : v < 0 ? "-" : "") + Math.abs(v).toFixed(d) + "%"; };
const monthName = (m, long) => new Date(m + "-01T12:00").toLocaleDateString("en-US", { month: long ? "long" : "short", year: "numeric" });
const addMonths = (m, n) => { const d = new Date(m + "-01T12:00"); d.setMonth(d.getMonth() + n); return d.toISOString().slice(0, 7); };
const DEPT = { FOODS: "Food", HOUSEHOLD: "Household", HOBBIES: "Hobbies" };
const deptName = d => { const [c, n] = d.split("_"); return `${DEPT[c]} ${n}`; };
const itemName = it => `${deptName(it.dept)}, item ${it.id.split("_").pop()}`;
const reduce = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

const PAGE = () => innerWidth <= 760 ? 10 : 25;
let D, M, current, shown = PAGE(), policy = "cost";
const POLICIES = {
  cost: { label: "Cost-based", note: "Each product is stocked to cover demand in the share of months its costs justify: food closer to the forecast, because leftovers may spoil; products that keep, well above it." },
  lean: { label: "Lean", note: "Every product is stocked to cover demand in 3 of 10 months. In the test this kept total stock about level with ordering last month's sales, and still lost less." },
  last: { label: "Last month", note: "The common rule of thumb: order what sold last month. Shown for comparison." },
};
const qOf = it => policy === "cost" ? it.order : policy === "lean" ? it.covers["30"] : it.order_last;
const lastOos = it => { const h = it.history.find(h => h.m === addMonths(D.asof, -1)); return h ? h.o : 0; };
function result(it, q) {
  const c = M.costs[it.cat], dmd = it.actual_demand;
  const short = Math.max(dmd - q, 0), extra = Math.max(q - dmd, 0);
  return { short, extra, cost: short * it.price * c.margin + extra * it.unit_cost * c.extra };
}

/* ---------- hero ---------- */
function hero() {
  const o = M.overall, tot = k => o[k].short_cost + o[k].extra_cost;
  const cmp = (rows, max, fmt) => el("div", { class: "cmp" }, ...rows.map(([name, v, color]) =>
    el("div", {}, el("span", { text: name }), el("span", { class: "t" }, el("i", { style: `width:${(v / max) * 100}%;background:${color}` })), el("b", { text: fmt(v) }))));
  const kpi = (label, v, rows, max, fmt, aria) => el("div", { class: "kpi panel", role: "group", "aria-label": aria },
    el("p", { class: "label", text: label }), el("p", { class: "v", text: v }), cmp(rows, max, fmt));
  const a = [tot("model"), tot("last")], f = [o.model.fill_rate, o.last.fill_rate], s = [o.model.stock_value / 12, o.last.stock_value / 12];
  return el("section", { class: "hero", id: "hero" },
    el("div", {},
      el("p", { class: "label", text: `Case study · Walmart store ${D.store} · M5 data` }),
      el("h1", {}, "Order for what a mistake costs, ", el("em", { text: "not for what sold last month." })),
      el("p", { class: "lede", text: `A monthly order sheet for a store with ${int(D.items.length)} products. Tested on 12 months it never saw, against the rule most small stores use.` })),
    el("div", { class: "kpis" },
      kpi("Cost of mistakes", usd(a[0]), [["This sheet", a[0], "var(--s1)"], ["Last month", a[1], "var(--sig)"]], Math.max(...a), usd,
        `Cost of mistakes: ${usd(a[0])} with this sheet, ${usd(a[1])} ordering last month's sales`),
      kpi("Demand met from stock", pct(f[0]), [["This sheet", f[0], "var(--s1)"], ["Last month", f[1], "var(--sig)"]], 1, v => pct(v),
        `Demand met: ${pct(f[0])} with this sheet, ${pct(f[1])} ordering last month's sales`),
      kpi("Stock on the shelf", spct(s[0] / s[1] - 1), [["This sheet", s[0], "var(--s1)"], ["Last month", s[1], "var(--sig)"]], Math.max(...s), usd,
        `Average stock: ${usd(s[0])} with this sheet, ${usd(s[1])} ordering last month's sales`)));
}

/* ---------- order sheet ---------- */
function sorted(f) {
  const q = f.q.trim().toLowerCase();
  const rows = D.items.filter(it => (!f.dept || it.dept === f.dept) && (!q || it.id.toLowerCase().includes(q) || itemName(it).toLowerCase().includes(q)));
  const val = it => qOf(it) * it.unit_cost, chg = it => qOf(it) - it.last;
  rows.sort(f.sort === "value" ? (a, b) => val(b) - val(a)
    : f.sort === "change" ? (a, b) => Math.abs(chg(b)) * b.unit_cost - Math.abs(chg(a)) * a.unit_cost

/* ---------- page ---------- */

  app.replaceChildren(hero(), el("div", { class: "desk", id: "desk" }, sheet(prev), current ? fileCard(current) : el("div")), report());
  // charts are drawn at the width they really get

function chart(it, q, W) {
  const months = []; for (let i = -12; i <= 0; i++) months.push(addMonths(D.asof, i));
  const byM = Object.fromEntries(it.history.map(h => [h.m, h]));
  // W is the real width, so text stays 12px on phones
  const H = W < 420 ? 190 : 210, L = 34, R = 8, T = 12, B = 26;
  const vals = months.map(m => byM[m] ? Math.max(byM[m].d, byM[m].s) : 0);
  const ymax = Math.max(...vals, it.high, q, 1) * 1.1;
  const step = niceStep(ymax / 4), top = Math.ceil(ymax / step) * step;
  const bw = (W - L - R) / months.length;
  const x = i => L + i * bw;
  const y = v => T + (1 - v / top) * (H - T - B);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img",
    "aria-label": `${itemName(it)}: monthly units for the last 12 months; forecast ${it.forecast.toFixed(0)}, order ${int(q)}, actual demand ${it.actual_demand.toFixed(0)}` });
  svg.append(svgEl("rect", { x: x(12), y: T, width: bw, height: H - T - B, fill: "var(--well)", opacity: 0.7 }));
  for (let v = 0; v <= top + 1e-9; v += step) {
    svg.append(svgEl("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: v === 0 ? "var(--axis)" : "var(--rule)" }));
    const t = svgEl("text", { x: L - 6, y: y(v) + 4, "text-anchor": "end" }); t.textContent = int(v); svg.append(t);
  }
  months.forEach((m, i) => {
    const h = byM[m]; if (!h) return;
    const g = 2, w = bw - 2 * g, lost = Math.max(h.d - h.s, 0);
    if (h.s > 0) svg.append(svgEl("rect", { x: x(i) + g, y: y(h.s), width: w, height: y(0) - y(h.s), fill: i === 12 ? "var(--s3)" : "var(--s1)", rx: 1.5 }));
    if (lost > 0.5) svg.append(svgEl("rect", { x: x(i) + g, y: y(h.s + lost), width: w, height: y(h.s) - y(h.s + lost) - 1, fill: "var(--sig)", "fill-opacity": 0.85, rx: 1.5 }));
    if (i % 3 === 0) { const t = svgEl("text", { x: x(i) + bw / 2, y: H - 8, "text-anchor": "middle" }); t.textContent = monthName(m).replace(" 20", " '"); svg.append(t); }
  });
  const fx = x(12), fw = bw;
  svg.append(svgEl("rect", { x: fx - 3, y: y(it.high), width: fw + 6, height: Math.max(1, y(it.low) - y(it.high)), fill: "var(--s1)", "fill-opacity": 0.16, rx: 2 }));
  svg.append(svgEl("line", { x1: fx - 6, x2: fx + fw + 6, y1: y(q), y2: y(q), stroke: "var(--ink)", "stroke-width": 2, "stroke-linecap": "round" }));
  const ot = svgEl("text", { x: fx - 9, y: y(q) + 4, "text-anchor": "end", style: "fill:var(--ink);font-weight:600" }); ot.textContent = "Order " + int(q); svg.append(ot);

  const wrap = el("div", { class: "chart" }, svg);
  const tip = el("div", { class: "tip", role: "status" });
  const hit = svgEl("rect", { x: L, y: T, width: W - L - R, height: H - T - B, fill: "transparent", tabindex: 0,
    "aria-label": "Chart readout. Use the left and right arrow keys to move between months." });
  svg.append(hit);
  let last = 12;
  const show = i => {
    const m = months[i], h = byM[m];
    const rows = h ? [["var(--s1)", `${int(h.s)} sold`], ...(h.d - h.s > 0.5 ? [["var(--sig)", `about ${(h.d - h.s).toFixed(0)} missed, ${h.o}d out of stock`]] : [])] : [[null, "Not carried"]];
    if (i === 12) rows.push(["var(--ink)", `order ${int(q)}, forecast ${it.forecast.toFixed(0)}`]);
    tip.replaceChildren(el("div", { class: "small", text: monthName(m) + (i === 12 ? " (the order month)" : "") }),
      ...rows.map(([c, t]) => el("div", { class: "row" }, c ? el("i", { style: `width:10px;height:10px;border-radius:2px;background:${c};display:inline-block` }) : null, el("span", { text: t }))));
    const box = svg.getBoundingClientRect(), px = ((x(i) + bw / 2) / W) * box.width;
    tip.style.left = Math.max(0, Math.min(px + 10, box.width - 240)) + "px"; tip.style.top = "0px";
    tip.classList.add("on");

  const hide = () => tip.classList.remove("on");

  hit.addEventListener("pointerleave", hide);

    if (e.key === "ArrowRight") { e.preventDefault(); show(last = Math.min(12, last + 1)); }

  wrap.append(tip);
  const table = el("table", { class: "plain" }, el("thead", {}, el("tr", {}, el("th", { text: "Month" }), el("th", { class: "r", text: "Sold" }),
    el("th", { class: "r", text: "Est. demand" }), el("th", { class: "r", text: "Days out" }))),
    el("tbody", {}, ...months.map(m => { const h = byM[m]; return el("tr", {}, el("td", { text: monthName(m) }),
      el("td", { class: "r", text: h ? int(h.s) : "" }), el("td", { class: "r", text: h ? h.d.toFixed(0) : "" }), el("td", { class: "r", text: h ? h.o : "" })); })));
  return el("div", { style: "display:grid;gap:10px" },
    el("div", { class: "legend" },

      el("span", {}, el("i", { class: "key-sq", style: "background:var(--sig)" }), "Missed while out of stock (estimated)"),
      el("span", {}, el("i", { class: "key-band" }), "Likely range"),
      el("span", {}, el("i", { class: "key-line" }), "Order"),
      el("span", {}, el("i", { class: "key-sq", style: "background:var(--s3)" }), "Sold in the order month")),
    wrap, el("details", {}, el("summary", { text: "Show as a table" }), table));
}

function niceStep(x) {
  const p = Math.pow(10, Math.floor(Math.log10(Math.max(x, 1e-9)))), r = x / p;
  return (r <= 1 ? 1 : r <= 2 ? 2 : r <= 5 ? 5 : 10) * p;
}

function frontierChart(W) {
  const o = M.overall, tot = k => o[k].short_cost + o[k].extra_cost, per = v => v / 12;
  const fr = M.frontier.map(f => ({ x: per(f.stock_value), y: f.short_cost + f.extra_cost, c: f.cover }));
  const pts = [
    { k: "last", x: per(o.last.stock_value), y: tot("last"), label: "Last month's sales", c: "var(--sig)" },
    { k: "buffer", x: per(o.buffer.stock_value), y: tot("buffer"), label: "Last month +20%", c: "var(--sig)" },
    { k: "model", x: per(o.model.stock_value), y: tot("model"), label: "Cost-based model", c: "var(--s1)" },
  ];
  const H = W < 500 ? 250 : 320, L = 54, R = 16, T = 14, B = 40;
  const xs = [...fr, ...pts].map(p => p.x), ys = [...fr, ...pts].map(p => p.y);
  const x0 = Math.min(...xs) * 0.95, x1 = Math.max(...xs) * 1.02;
  const ystep = niceStep(Math.max(...ys) / 4), ytop = Math.ceil(Math.max(...ys) * 1.05 / ystep) * ystep;
  const x = v => L + (v - x0) / (x1 - x0) * (W - L - R), y = v => T + (1 - v / ytop) * (H - T - B);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img",
    "aria-label": "Stock carried against the cost of mistakes. The model's line sits below both simple rules at every stock level." });
  for (let v = 0; v <= ytop + 1e-9; v += ystep) {
    svg.append(svgEl("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: v === 0 ? "var(--axis)" : "var(--rule)" }));
    const t = svgEl("text", { x: L - 8, y: y(v) + 4, "text-anchor": "end" }); t.textContent = usd(v); svg.append(t);
  }
  const xstep = niceStep((x1 - x0) / 4);
  for (let v = Math.ceil(x0 / xstep) * xstep; v <= x1; v += xstep) {
    const t = svgEl("text", { x: x(v), y: H - 22, "text-anchor": "middle" }); t.textContent = usd(v); svg.append(t);
  }
  const xl = svgEl("text", { x: L + (W - L - R) / 2, y: H - 4, "text-anchor": "middle" }); xl.textContent = "Average stock on the shelf, at cost"; svg.append(xl);
  svg.append(svgEl("path", { d: fr.map((p, i) => `${i ? "L" : "M"}${x(p.x)},${y(p.y)}`).join(" "), fill: "none", stroke: "var(--s1)", "stroke-width": 2, "stroke-linejoin": "round" }));
  fr.forEach(p => svg.append(svgEl("circle", { cx: x(p.x), cy: y(p.y), r: 3, fill: "var(--s1)" })));
  const lt = svgEl("text", { x: x(fr[fr.length - 1].x) - 4, y: y(fr[fr.length - 1].y) - 12, "text-anchor": "end", style: "fill:var(--s1)" });
  lt.textContent = "Model, one setting for all products";
  if (W >= 500) svg.append(lt);  // on phones the note under the chart names the line
  pts.forEach(p => {
    svg.append(svgEl("circle", { cx: x(p.x), cy: y(p.y), r: 6, fill: p.c, stroke: "var(--panel)", "stroke-width": 2 }));
    const t = svgEl("text", { x: x(p.x) + 11, y: y(p.y) + (p.k === "model" ? 18 : 4), "text-anchor": "start", style: `fill:var(--ink);font-weight:${p.k === "model" ? 700 : 500}` });
    t.textContent = p.label; svg.append(t);
  });
  return el("div", { class: "chart" }, svg);
}

(async function init() {
  const src = new URLSearchParams(location.search).get("data") || "data.json";
  D = window.__DATA || await (await fetch(src)).json();
  M = D.metrics;
  $("#crumb").textContent = `Walmart store ${D.store} · order for ${monthName(D.asof)}`;
  $("#foot").textContent = "Data: M5 Forecasting competition (Walmart, via Kaggle), not included in the repository. Product names are hidden in the data, so products are shown by department and number.";
  const id = location.hash.slice(1);
  current = D.items.find(it => it.id === id)
    || D.items.find(it => it.tier === "A" && lastOos(it) >= 3 && it.forecast >= 20) || D.items[0];
  render(true);
  let lastW = innerWidth, rt;
  addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (innerWidth !== lastW) { lastW = innerWidth; shown = Math.max(shown, PAGE()); render(); } }, 150); });
})();
</script>
