<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shelf Signal</title>
<style>
:root {
  color-scheme: light;
  --paper: #f5f2ea; --sheet: #fbf9f4; --well: #ece8dd;
  --ink: #1c1b18; --ink-2: #55524a; --muted: #6f6b61;
  --rule: #ddd7c9; --rule-strong: #1c1b18; --axis: #bdb6a4;
  --s1: #2a62a8; --sig: #c4422a; --s3: #1f8a70;
  --shadow: 0 1px 2px rgba(28,27,24,0.06), 0 8px 24px rgba(28,27,24,0.10);
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --serif: "Iowan Old Style", "Charter", "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Menlo, Consolas, monospace;
  font: 15px/1.5 var(--sans);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --paper: #151412; --sheet: #1d1b18; --well: #262420;
    --ink: #ece8de; --ink-2: #b9b3a5; --muted: #948e81;
    --rule: #2e2b26; --rule-strong: #ece8de; --axis: #4a463e;
    --s1: #4f8fdc; --sig: #e0613f; --s3: #2fa383;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.45);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; font-family: var(--serif); font-weight: 600; text-wrap: balance; letter-spacing: -0.005em; }
p, ul, ol, dl, dd { margin: 0; }
p, li { text-wrap: pretty; }
.small { font-size: 13px; color: var(--ink-2); }
.num { font-variant-numeric: tabular-nums; }
.kicker { font-size: 11px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; border-radius: 2px; }
button, select, input, summary { -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 1440px; margin: 0 auto; padding: 0 32px; }

/* masthead */
.mast { border-bottom: 1px solid var(--rule-strong); }
.mast-in { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 32px; align-items: end; padding-top: 28px; padding-bottom: 22px; }
.mast h1 { font-size: 40px; line-height: 1.05; margin-top: 6px; }
.deck { font-family: var(--serif); font-size: 19px; color: var(--ink-2); margin-top: 8px; font-style: italic; max-width: 44ch; }
.facts { display: grid; grid-auto-flow: column; }
.facts div { padding: 0 22px; border-left: 1px solid var(--rule); }
.facts div:first-child { border-left: 0; }
.facts dt { font-size: 12px; color: var(--muted); max-width: 20ch; }
.facts dd { font-size: 26px; font-weight: 600; line-height: 1.15; letter-spacing: -0.01em; }
.facts dd small { font-size: 13px; font-weight: 500; color: var(--ink-2); letter-spacing: 0; }

/* sections */
.sec { border-top: 1px solid var(--rule-strong); padding-top: 12px; display: grid; gap: 14px; align-content: start; }
.sec-label { display: flex; gap: 10px; align-items: baseline; }
.sec-label b { font-size: 11px; font-weight: 700; color: var(--sig); letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
.sec h3 { font-size: 21px; line-height: 1.2; }
.page { display: grid; gap: 34px; padding: 26px 0 0; }

/* order sheet + product file */
.desk { display: grid; grid-template-columns: minmax(0, 1fr) 470px; gap: 36px; align-items: start; }
.tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
input[type=search], select { font: inherit; font-size: 14px; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--axis); background: var(--sheet); color: var(--ink); }
input[type=search] { width: 220px; }
.seg { display: inline-flex; border: 1px solid var(--axis); border-radius: 6px; padding: 2px; background: var(--sheet); }
.seg button { font: inherit; font-size: 13px; border: 0; background: none; color: var(--ink-2); padding: 5px 10px; border-radius: 4px; cursor: pointer;
  transition: background-color 120ms ease, color 120ms ease; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.policy-note { font-size: 13px; color: var(--ink-2); max-width: 78ch; }

.totals { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.tot { padding: 12px 18px 14px; border-left: 1px solid var(--rule); display: grid; gap: 2px; align-content: start; }
.tot:first-child { border-left: 0; padding-left: 0; }
.tot .v { font-size: 26px; font-weight: 600; line-height: 1.15; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.tot .d { font-size: 13px; color: var(--ink-2); }

.ledger { width: 100%; border-collapse: collapse; font-size: 14px; }
.ledger th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 8px 8px; border-bottom: 1px solid var(--rule-strong); white-space: nowrap; }
.ledger td { padding: 0; border-bottom: 1px solid var(--rule); }
.ledger th:first-child { padding-left: 0; }
.ledger .r { text-align: right; }
.ledger tbody tr { cursor: pointer; transition: background-color 120ms ease; }
.ledger tbody tr[aria-selected="true"] { background: var(--sheet); box-shadow: inset 3px 0 0 var(--ink); }
@media (hover: hover) and (pointer: fine) { .ledger tbody tr:hover { background: var(--sheet); } }
.ledger td > span { display: block; padding: 9px 8px; }
.ledger td:first-child > span { padding-left: 12px; }
.ledger .fig { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.ledger .order { font-weight: 700; }
.pid { font-weight: 500; }
.pid small { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
.up { color: var(--s1); }
.down { color: var(--sig); }
.tag { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
  border: 1px solid var(--axis); border-radius: 3px; padding: 0 5px; line-height: 16px; display: inline-block; }
.tag.warn { color: var(--sig); border-color: color-mix(in srgb, var(--sig) 55%, transparent); }
.more { font: inherit; font-size: 14px; margin-top: 12px; padding: 7px 14px; border-radius: 6px; border: 1px solid var(--axis); background: var(--sheet); color: var(--ink); cursor: pointer;
  transition: background-color 120ms ease, scale 150ms ease-out; }
.more:not(:disabled):active { scale: 0.96; }
@media (hover: hover) and (pointer: fine) { .more:hover { background: var(--well); } }

.file { position: sticky; top: 16px; display: grid; gap: 16px; background: var(--sheet); border: 1px solid transparent; border-radius: 10px; box-shadow: var(--shadow); padding: 18px 20px 20px; }
.file h2 { font-size: 26px; line-height: 1.1; }
.file .meta { font-size: 13px; color: var(--ink-2); }
.file-figs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.file-figs div { padding: 10px 12px 12px; border-left: 1px solid var(--rule); display: grid; gap: 2px; align-content: start; }
.file-figs div:first-child { border-left: 0; padding-left: 0; }
.file-figs .v { font-size: 24px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.file-figs .d { font-size: 12px; color: var(--ink-2); }
.reasons { padding-left: 18px; display: grid; gap: 6px; font-size: 14px; }
.reasons li::marker { color: var(--sig); }
.math { font-size: 13px; color: var(--ink-2); border-left: 2px solid var(--rule); padding-left: 10px; }
.outcome { font-size: 14px; }
.outcome b { font-variant-numeric: tabular-nums; }

.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.key-sq { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.key-band { width: 16px; height: 10px; background: color-mix(in srgb, var(--s1) 16%, transparent); display: inline-block; border-radius: 2px; }
.key-line { width: 16px; height: 0; border-top: 2px solid var(--ink); display: inline-block; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; paint-order: stroke; stroke: var(--halo, var(--paper)); stroke-width: 3px; stroke-linejoin: round; }
.file .chart, .findings .chart { --halo: var(--sheet); }
.tip { position: absolute; pointer-events: none; background: var(--paper); border: 1px solid transparent; border-radius: 8px;
  box-shadow: var(--shadow); padding: 8px 10px; font-size: 13px; min-width: 150px; opacity: 0; transition: opacity 120ms ease; z-index: 2; }
.tip.on { opacity: 1; }
.tip .row { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
details summary { cursor: pointer; font-size: 13px; color: var(--ink-2); width: fit-content; }
table.plain { border-collapse: collapse; width: 100%; font-size: 14px; }
table.plain th, table.plain td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--rule); }
table.plain th { font-weight: 600; color: var(--muted); font-size: 12px; }
table.plain th:first-child, table.plain td:first-child { padding-left: 0; }
table.plain .r { text-align: right; font-variant-numeric: tabular-nums; }
table.plain td.win { font-weight: 700; }

/* findings */
.findings { background: var(--sheet); border-top-width: 2px; padding: 18px 32px 40px; margin: 0 -32px; gap: 24px; }
.pull { font-family: var(--serif); font-size: 28px; line-height: 1.2; max-width: 32ch; }
.pull em { color: var(--sig); font-style: normal; }
.lede { font-size: 16px; max-width: 72ch; color: var(--ink-2); }
.findings h4 { margin: 0 0 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.findings ul { padding-left: 18px; display: grid; gap: 8px; }
.findings li::marker { color: var(--sig); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; }
.score { display: grid; gap: 0; border-top: 1px solid var(--rule); }
.score > div { display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; gap: 14px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
.score .res { font-family: var(--mono); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.score .res small { display: block; font-family: var(--sans); color: var(--muted); font-size: 12px; }
.verdict { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; border-radius: 3px; padding: 0 6px; line-height: 18px; width: fit-content; }
.verdict.met { color: var(--s3); border: 1px solid color-mix(in srgb, var(--s3) 60%, transparent); }
.verdict.miss { color: var(--sig); border: 1px solid color-mix(in srgb, var(--sig) 60%, transparent); }
.note { font-size: 13px; color: var(--muted); }
footer { padding: 22px 0 40px; font-size: 13px; color: var(--muted); }
.empty { padding: 40px 0; color: var(--ink-2); }

/* first load only: sections arrive in order */
@media (prefers-reduced-motion: no-preference) {
  .enter > * { animation: rise 300ms var(--ease-out) both; }
  .enter > *:nth-child(2) { animation-delay: 100ms; }
  .enter > *:nth-child(3) { animation-delay: 200ms; }
  .enter > *:nth-child(n+4) { animation-delay: 300ms; }
}
@media (prefers-reduced-motion: reduce) {
  .enter > * { animation: fade 300ms ease both; }
  .tip, .ledger tbody tr, .seg button, .more { transition: none; }
}
@keyframes rise { from { opacity: 0; transform: translateY(12px); filter: blur(4px); } }
@keyframes fade { from { opacity: 0; } }

@media (max-width: 1180px) {
  .mast-in { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .facts div:first-child { padding-left: 0; }
  .desk { grid-template-columns: minmax(0, 1fr); }
  .file { position: static; }
  .hide-md { display: none; }
}
@media (max-width: 760px) {
  .wrap { padding: 0 18px; }
  .mast-in { padding-top: 22px; padding-bottom: 18px; }
  .mast h1 { font-size: 32px; }
  .deck { font-size: 17px; }
  .facts { grid-auto-flow: row; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .facts div { padding: 0 10px; }
  .facts dd { font-size: 20px; }
  .facts dd small { display: block; font-size: 12px; }
  .totals { grid-template-columns: 1fr 1fr; }
  .tot:nth-child(3) { border-left: 0; padding-left: 0; }
  .tot:nth-child(n+3) { border-top: 1px solid var(--rule); }
  .tot { padding: 10px 12px 12px; }
  .tot .v { font-size: 22px; }
  .hide-sm { display: none; }
  input[type=search] { width: 100%; }
  .tools select { flex: 1; }
  .file { padding: 16px 14px 18px; }
  .file-figs .v { font-size: 20px; }
  .file-figs div { padding: 8px 8px 10px; }
  .two { grid-template-columns: minmax(0, 1fr); gap: 28px; }
  .findings { margin: 0 -18px; padding: 16px 18px 32px; }
  .pull { font-size: 23px; }
  .score > div { grid-template-columns: 70px minmax(0, 1fr); }
  .score .res { grid-column: 2; text-align: left; }
}
</style>
</head>
<body>
<header class="mast">
  <div class="wrap mast-in">
    <div>
      <p class="kicker" id="kicker">Case study</p>
      <h1>Shelf Signal</h1>
      <p class="deck">Order for what a mistake costs, not for what sold last month.</p>
    </div>
    <dl class="facts" id="facts"></dl>
  </div>
</header>
<div class="wrap"><div class="page" id="page"><p class="empty">Loading data…</p></div></div>
<footer class="wrap" id="foot"></footer>

<script>
const $ = (s, el = document) => el.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? e.className = v : k === "text" ? e.textContent = v : e.setAttribute(k, v);
  for (const k of kids) if (k != null) e.append(k);
  return e;
};
const svgEl = (tag, attrs = {}) => {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
};
const int = n => Math.round(n).toLocaleString("en-US");
const usd = n => n >= 1e6 ? "$" + (n / 1e6).toFixed(2) + "M" : n >= 1e4 ? "$" + Math.round(n / 1000) + "K" : "$" + Math.round(n).toLocaleString("en-US");
const pct = (x, d = 0) => (x * 100).toFixed(d) + "%";
const spct = (x, d = 0) => { const v = +(x * 100).toFixed(d); return (v > 0 ? "+" : v < 0 ? "-" : "") + Math.abs(v).toFixed(d) + "%"; };
const monthName = (m, long) => new Date(m + "-01T12:00").toLocaleDateString("en-US", { month: long ? "long" : "short", year: "numeric" });
const addMonths = (m, n) => { const d = new Date(m + "-01T12:00"); d.setMonth(d.getMonth() + n); return d.toISOString().slice(0, 7); };
const DEPT = { FOODS: "Food", HOUSEHOLD: "Household", HOBBIES: "Hobbies" };
const deptName = d => { const [c, n] = d.split("_"); return `${DEPT[c]} ${n}`; };
const itemName = it => `${deptName(it.dept)}, item ${it.id.split("_").pop()}`;

const PAGE = () => innerWidth <= 760 ? 10 : 40;
let D, M, current, shown = PAGE(), policy = "cost";
const POLICIES = {
  cost: { label: "Cost-based", note: "Each product is stocked to cover demand in the share of months its costs justify: food closer to the forecast, because leftovers may spoil; products that keep, well above it." },
  lean: { label: "Lean", note: "Every product is stocked to cover demand in 3 of 10 months. In the test this kept total stock about level with ordering last month's sales, and still lost less." },
  last: { label: "Last month", note: "The common rule of thumb: order what sold last month. Shown for comparison." },
};
const qOf = it => policy === "cost" ? it.order : policy === "lean" ? it.covers["30"] : it.order_last;
const lastOos = it => { const h = it.history.find(h => h.m === addMonths(D.asof, -1)); return h ? h.o : 0; };
function result(it, q) {
  const c = M.costs[it.cat], dmd = it.actual_demand;
  const short = Math.max(dmd - q, 0), extra = Math.max(q - dmd, 0);
  return { short, extra, cost: short * it.price * c.margin + extra * it.unit_cost * c.extra };
}

function renderFacts() {
  const o = M.overall, tot = k => o[k].short_cost + o[k].extra_cost;
  const fact = (dt, dd, sm) => el("div", {}, el("dt", { text: dt }), el("dd", {}, dd, sm ? el("small", { text: " " + sm }) : null));
  $("#facts").replaceChildren(
    fact("Cost of mistakes, 12 test months", usd(tot("model")), `vs ${usd(tot("last"))}`),
    fact("Demand met", pct(o.model.fill_rate), `vs ${pct(o.last.fill_rate)}`),
    fact("Stock carried", spct(o.model.stock_value / o.last.stock_value - 1), "more"));
}

function sorted(f) {
  const q = f.q.trim().toLowerCase(), dept = f.dept, sort = f.sort;
  let rows = D.items.filter(it => (!dept || it.dept === dept) && (!q || it.id.toLowerCase().includes(q) || itemName(it).toLowerCase().includes(q)));
  const val = it => qOf(it) * it.unit_cost;
  const chg = it => qOf(it) - it.last;
  rows.sort(sort === "value" ? (a, b) => val(b) - val(a)
    : sort === "change" ? (a, b) => Math.abs(chg(b)) * b.unit_cost - Math.abs(chg(a)) * a.unit_cost
    : (a, b) => lastOos(b) - lastOos(a) || val(b) - val(a));
  return rows;
}

function renderSheet(first = false) {
  const page = $("#page");
  const prev = { q: $("#q")?.value || "", dept: $("#dept")?.value || "", sort: $("#sort")?.value || "value" };
  const rows = sorted(prev);
  const all = D.items.map(it => ({ q: qOf(it), it }));
  const value = all.reduce((s, r) => s + r.q * r.it.unit_cost, 0);
  const lastValue = D.items.reduce((s, it) => s + it.order_last * it.unit_cost, 0);
  const res = all.reduce((s, r) => { const x = result(r.it, r.q); s.cost += x.cost; s.short += x.short; s.dem += r.it.actual_demand; return s; }, { cost: 0, short: 0, dem: 0 });
  const resLast = D.items.reduce((s, it) => s + result(it, it.order_last).cost, 0);

  const sheet = el("section", { class: "sec" },
    el("div", { class: "sec-label" }, el("b", { text: "01" }), el("span", { class: "kicker", text: "Order sheet" })),
    el("h3", { text: `What to stock for ${monthName(D.asof, true)}, made on the last day of ${monthName(addMonths(D.asof, -1), true).split(" ")[0]}` }));
  const seg = el("div", { class: "seg", role: "group", "aria-label": "Stock policy" },
    ...Object.entries(POLICIES).map(([k, p]) => {
      const b = el("button", { "aria-pressed": String(k === policy), text: p.label });
      b.onclick = () => { policy = k; renderSheet(); };
      return b;
    }));
  sheet.append(el("div", { class: "tools" }, seg), el("p", { class: "policy-note", text: POLICIES[policy].note }));

  const tot = (k, v, d) => el("div", { class: "tot" }, el("p", { class: "kicker", text: k }), el("p", { class: "v", text: v }), el("p", { class: "d", text: d }));
  sheet.append(el("div", { class: "totals" },
    tot("Stock value", usd(value), policy === "last" ? "At cost" : `${spct(value / lastValue - 1)} against last month's sales`),
    tot("Products", int(D.items.length), `${int(D.items.filter(it => qOf(it) > 0).length)} with an order`),
    tot(`How ${monthName(D.asof).split(" ")[0]} went`, pct(1 - res.short / res.dem), "of demand met from stock"),
    tot("Cost of mistakes", usd(res.cost), policy === "last" ? "Lost profit plus overstock" : `vs ${usd(resLast)} ordering last month's sales`)));

  const tools = el("div", { class: "tools" },
    el("input", { type: "search", id: "q", placeholder: "Search a product, e.g. 090", "aria-label": "Search products" }),
    el("select", { id: "dept", "aria-label": "Department" }, el("option", { value: "", text: "All departments" }),
      ...[...new Set(D.items.map(it => it.dept))].sort().map(d => el("option", { value: d, text: deptName(d) }))),
    el("select", { id: "sort", "aria-label": "Sort" },
      el("option", { value: "value", text: "Largest order value" }),
      el("option", { value: "change", text: "Biggest change from last month" }),
      el("option", { value: "oos", text: "Most days out of stock last month" })));
  tools.querySelector("#q").value = prev.q; tools.querySelector("#dept").value = prev.dept; tools.querySelector("#sort").value = prev.sort;

  const table = el("table", { class: "ledger", "aria-label": "Order sheet" },
    el("thead", {}, el("tr", {},
      el("th", { text: "Product" }), el("th", { class: "r hide-sm", text: "Sold last month" }), el("th", { class: "r hide-md", text: "Forecast" }),
      el("th", { class: "r", text: "Order" }), el("th", { class: "r", text: "Change" }), el("th", { class: "r hide-sm", text: "Order value" }),
      el("th", { class: "hide-md", text: "Last month" }))));
  const tb = el("tbody");
  const list = rows.slice(0, shown);
  for (const it of list) {
    const q = qOf(it), ch = q - it.last, oos = lastOos(it);
    const cell = (cls, ...k) => el("td", { class: cls }, el("span", {}, ...k));
    const tr = el("tr", { "aria-selected": String(it === current), tabindex: 0 },
      cell("", el("span", { class: "pid" }, itemName(it), el("small", { text: it.id }))),
      cell("r fig hide-sm", int(it.last)),
      cell("r fig hide-md", it.forecast.toFixed(0)),
